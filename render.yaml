services:
  # Backend API Web Service
  - type: web
    name: nexora-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://ecommerce-web-app.vercel.app

databases:
  # Hosted PostgreSQL Database
  - name: nexora-db
    databaseName: nexora
    user: nexora_user
    plan: free
    region: oregon
